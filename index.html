<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Churchill Solitär</title>
<style>
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  margin:0;background:#064b32;color:white;
  font-family:Arial,sans-serif;text-align:center;
}
header{
  background:#073c2b;border-bottom:4px solid #e7c45b;
  display:flex;align-items:center;justify-content:center;
  gap:14px;padding:8px 10px;flex-wrap:wrap;
}
header .mid{min-width:230px}
h1{color:#f4d36a;margin:4px;font-family:Georgia,serif;letter-spacing:1px}
.motto{font-style:italic;color:#d9eadf;font-size:13px}
header svg{height:86px;width:auto}
header svg.churchill{height:112px}
.flag{border:1px solid #e7c45b;border-radius:3px}
button{
  border:0;border-radius:7px;padding:10px 14px;
  background:#e7c45b;color:#18291d;
  font-weight:bold;cursor:pointer;margin:4px;
}
button:hover{background:#ffe18a}
.info{padding:8px}
#game{max-width:1200px;margin:auto;padding:8px}
.top{
 display:flex;justify-content:center;align-items:flex-start;
 gap:9px;flex-wrap:wrap;margin:10px 0 34px;
}
.area{
 position:relative;width:68px;height:98px;
 border:2px dashed #a4c8b5;border-radius:7px;
 flex-shrink:0;
}
.area .caption{
 position:absolute;top:-19px;width:100%;
 font-size:11px;color:#d9eadf;
}
.area .count{
 position:absolute;bottom:-24px;width:100%;
 font-size:13px;font-weight:bold;color:#f4d36a;
}
.ph{
 position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 font-size:34px;color:#a4c8b5;opacity:.75;
}
.ph.red{color:#ff9aa4}
.card{
 position:absolute;left:0;width:64px;height:90px;
 background:#fff;color:#111;border:1px solid #222;
 border-radius:6px;text-align:left;
 padding:4px;font-size:16px;font-weight:bold;
 cursor:pointer;box-shadow:1px 2px 3px #163c2b;
 user-select:none;
}
.card.red{color:#c51626}
.card.back{
 background:
  repeating-linear-gradient(45deg,transparent 0 5px,rgba(255,255,255,.06) 5px 6px),
  repeating-linear-gradient(-45deg,transparent 0 5px,rgba(255,255,255,.06) 5px 6px),
  #0d3a2b;
 box-shadow:inset 0 0 0 3px #0d3a2b,inset 0 0 0 4px rgba(231,196,91,.55),1px 2px 3px #163c2b;
 color:rgba(231,196,91,.7);
}
.card.stockcard{display:flex;align-items:center;justify-content:center;font-size:28px;text-shadow:0 0 4px #000,0 0 4px #000}
.card .big{
 position:absolute;left:0;right:0;top:25px;
